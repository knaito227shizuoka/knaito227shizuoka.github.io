<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>足し算練習ゲーム</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .game-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 500px;
            width: 90%;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .problem {
            font-size: 3em;
            margin: 20px 0;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }
        
        .input-section {
            margin: 30px 0;
        }
        
        input[type="number"] {
            font-size: 2em;
            padding: 15px;
            width: 150px;
            text-align: center;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        
        input[type="number"]:focus {
            outline: none;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }
        
        .buttons {
            margin: 20px 0;
        }
        
        button {
            font-size: 1.5em;
            padding: 15px 30px;
            margin: 10px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }
        
        button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
        }
        
        .score {
            font-size: 1.8em;
            margin: 20px 0;
            display: flex;
            justify-content: space-around;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }
        
        .feedback {
            font-size: 2em;
            margin: 20px 0;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }
        
        .correct {
            color: #4CAF50;
        }
        
        .incorrect {
            color: #f44336;
        }
        
        .difficulty {
            margin: 20px 0;
        }
        
        select {
            font-size: 1.2em;
            padding: 10px;
            border-radius: 8px;
            border: none;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🧮 足し算練習ゲーム</h1>
        
        <div class="difficulty">
            <label for="difficulty">難易度: </label>
            <select id="difficulty" onchange="changeDifficulty()">
                <option value="easy">簡単 (1-10)</option>
                <option value="medium">普通 (1-50)</option>
                <option value="hard">難しい (1-100)</option>
            </select>
        </div>
        
        <div class="problem" id="problem"></div>
        
        <div class="input-section">
            <input type="number" id="answer" placeholder="答え" onkeypress="checkEnter(event)">
        </div>
        
        <div class="buttons">
            <button onclick="checkAnswer()">答え合わせ</button>
            <button onclick="newProblem()">次の問題</button>
        </div>
        
        <div class="feedback" id="feedback"></div>
        
        <div class="score">
            <div>正解: <span id="correct">0</span></div>
            <div>不正解: <span id="incorrect">0</span></div>
            <div>正答率: <span id="accuracy">-</span>%</div>
        </div>
    </div>

    <script>
        let currentProblem = {};
        let correctCount = 0;
        let incorrectCount = 0;
        let difficulty = 'easy';
        
        const difficultyRanges = {
            easy: { min: 1, max: 10 },
            medium: { min: 1, max: 50 },
            hard: { min: 1, max: 100 }
        };
        
        function generateProblem() {
            const range = difficultyRanges[difficulty];
            const num1 = Math.floor(Math.random() * range.max) + range.min;
            const num2 = Math.floor(Math.random() * range.max) + range.min;
            
            currentProblem = {
                num1: num1,
                num2: num2,
                answer: num1 + num2
            };
            
            document.getElementById('problem').textContent = `${num1} + ${num2} = ?`;
            document.getElementById('answer').value = '';
            document.getElementById('feedback').textContent = '';
            document.getElementById('answer').focus();
        }
        
        function checkAnswer() {
            const userAnswer = parseInt(document.getElementById('answer').value);
            const feedbackElement = document.getElementById('feedback');
            
            if (isNaN(userAnswer)) {
                feedbackElement.textContent = '数字を入力してください';
                feedbackElement.className = 'feedback incorrect';
                return;
            }
            
            if (userAnswer === currentProblem.answer) {
                feedbackElement.textContent = '🎉 正解！';
                feedbackElement.className = 'feedback correct';
                correctCount++;
                document.getElementById('correct').textContent = correctCount;
            } else {
                feedbackElement.textContent = `❌ 不正解！正解は ${currentProblem.answer} です`;
                feedbackElement.className = 'feedback incorrect';
                incorrectCount++;
                document.getElementById('incorrect').textContent = incorrectCount;
            }
            
            updateAccuracy();
        }
        
        function newProblem() {
            generateProblem();
        }
        
        function changeDifficulty() {
            difficulty = document.getElementById('difficulty').value;
            generateProblem();
        }
        
        function updateAccuracy() {
            const total = correctCount + incorrectCount;
            if (total > 0) {
                const accuracy = Math.round((correctCount / total) * 100);
                document.getElementById('accuracy').textContent = accuracy;
            }
        }
        
        function checkEnter(event) {
            if (event.key === 'Enter') {
                checkAnswer();
            }
        }
        
        // ゲーム開始時に最初の問題を生成
        generateProblem();
    </script>
</body>
</html>

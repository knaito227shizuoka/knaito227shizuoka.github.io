<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex">
    <title>誕生日記録簿</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif;
        }

        .move-dialog {
            width: 100%;
            max-width: 360px;
            background: #ffffff;
            border-radius: 18px;
            padding: 28px 24px 24px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .move-icon {
            font-size: 40px;
            line-height: 1;
            margin-bottom: 12px;
        }

        .move-text {
            color: #333333;
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 20px;
        }

        .move-ok {
            width: 100%;
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .move-ok:focus-visible {
            outline: 3px solid #ffffff;
            outline-offset: 3px;
        }
    </style>
</head>
<body>
    <!-- 旧「誕生日記録簿」：新アプリ「誕生日フォルダ」への移行のお知らせだけを表示する（外部のファイルは読み込まない） -->
    <div class="move-dialog" role="alertdialog" aria-modal="true" aria-labelledby="move-title">
        <p class="move-icon">🎂</p>
        <p id="move-title" class="move-text">サイトが更新されました。<br>新しいサイトにデータを移行します。</p>
        <button type="button" class="move-ok" id="move-ok">OK</button>
    </div>

    <script>
        (function () {
            var NEW_URL = "https://birthday-rec.pages.dev/";

            // 登録データを旧形式のGETパラメータにして、新アプリへ渡す
            function buildUrl() {
                var params = new URLSearchParams(location.search);
                if (!params.has("name1")) {
                    try {
                        var data = JSON.parse(localStorage.getItem("familyBirthdayData") || "{}");
                        var i = 1;
                        Object.keys(data).forEach(function (name) {
                            if (data[name] && data[name].birthday) {
                                params.set("name" + i, name);
                                params.set("birthday" + i, data[name].birthday);
                                i++;
                            }
                        });
                    } catch (e) {
                        // 読み込めなければデータなしで移動する
                    }
                }
                // LINEのアプリ内ブラウザで開いていても、新アプリは外のブラウザで開く（LINEの公式機能）
                params.set("openExternalBrowser", "1");
                return NEW_URL + "?" + params.toString();
            }

            var ok = document.getElementById("move-ok");
            ok.addEventListener("click", function () {
                location.replace(buildUrl());
            });
            ok.focus();
        })();
    </script>
</body>
</html>

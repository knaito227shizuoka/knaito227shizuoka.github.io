<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDoアプリ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f0f8f0;
            color: #333;
        }

        h1 {
            text-align: center;
            color: #2e7d32;
            margin-bottom: 30px;
        }

        .todo-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(46, 125, 50, 0.1);
        }

        .input-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        #todoInput {
            flex: 1;
            padding: 10px;
            border: 2px solid #4caf50;
            border-radius: 5px;
            outline: none;
        }

        #todoInput:focus {
            border-color: #2e7d32;
        }

        #addBtn {
            padding: 10px 20px;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        #addBtn:hover {
            background-color: #2e7d32;
        }

        .todo-list {
            list-style: none;
            padding: 0;
        }

        .todo-item {
            display: flex;
            align-items: center;
            padding: 10px;
            margin-bottom: 10px;
            background-color: #e8f5e8;
            border-radius: 5px;
            border-left: 4px solid #4caf50;
        }

        .todo-item.completed {
            background-color: #f5f5f5;
            text-decoration: line-through;
            opacity: 0.7;
            border-left-color: #ccc;
        }

        .todo-text {
            flex: 1;
            margin-left: 10px;
        }

        .delete-btn {
            background-color: #e57373;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }

        .delete-btn:hover {
            background-color: #d32f2f;
        }

        .checkbox {
            width: 20px;
            height: 20px;
            accent-color: #4caf50;
        }

        .empty-message {
            text-align: center;
            color: #666;
            padding: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1>ToDoアプリ</h1>
    
    <div class="todo-container">
        <div class="input-section">
            <input type="text" id="todoInput" placeholder="新しいタスクを入力してください...">
            <button id="addBtn">追加</button>
        </div>
        
        <ul id="todoList" class="todo-list">
            <li class="empty-message">タスクがありません</li>
        </ul>
    </div>

    <script>
        let todos = JSON.parse(localStorage.getItem('todos')) || [];
        
        const todoInput = document.getElementById('todoInput');
        const addBtn = document.getElementById('addBtn');
        const todoList = document.getElementById('todoList');

        function saveTodos() {
            localStorage.setItem('todos', JSON.stringify(todos));
        }

        function renderTodos() {
            todoList.innerHTML = '';
            
            if (todos.length === 0) {
                todoList.innerHTML = '<li class="empty-message">タスクがありません</li>';
                return;
            }

            todos.forEach((todo, index) => {
                const li = document.createElement('li');
                li.className = `todo-item ${todo.completed ? 'completed' : ''}`;
                
                li.innerHTML = `
                    <input type="checkbox" class="checkbox" ${todo.completed ? 'checked' : ''} 
                           onchange="toggleTodo(${index})">
                    <span class="todo-text">${todo.text}</span>
                    <button class="delete-btn" onclick="deleteTodo(${index})">削除</button>
                `;
                
                todoList.appendChild(li);
            });
        }

        function addTodo() {
            const text = todoInput.value.trim();
            if (text) {
                todos.push({
                    text: text,
                    completed: false,
                    id: Date.now()
                });
                todoInput.value = '';
                saveTodos();
                renderTodos();
            }
        }

        function deleteTodo(index) {
            todos.splice(index, 1);
            saveTodos();
            renderTodos();
        }

        function toggleTodo(index) {
            todos[index].completed = !todos[index].completed;
            saveTodos();
            renderTodos();
        }

        addBtn.addEventListener('click', addTodo);
        
        todoInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addTodo();
            }
        });

        // 初期表示
        renderTodos();
    </script>
</body>
</html>
